<div class="header">
  <span></span>
  <h1>Crear torneo</h1>
  <span></span>
  <p>Completa los datos para crear un torneo</p>
</div>
<div class="form-group">
  <label>Lugar de Encuentro</label>
  <span></span>
  <input type="text" placeholder="Ingrese el lugar de Encuentro">
</div>
<div class="form-group">
  <label>Cantidad de Equipos</label>
  <button type="button" (click)="disminuirEquipo()">➖</button>
  <input type="number"
    [(ngModel)]="cantidadEquipos"
    min="2"
    readonly
  />
  <button type="button" (click)="aumentarequipo()">➕</button>

</div>
